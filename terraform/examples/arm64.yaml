apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-arm64
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-arm64
  template:
    metadata:
      labels:
        app: hello-arm64
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: arm64
        opsfleet.com/node-purpose: workload
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # OCI index digest verified to contain linux/amd64 and linux/arm64.
          image: docker.io/library/busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
          command: ["/bin/sh", "-ec"]
          args:
            - |
              uname -m
              printf 'architecture=%s\n' "$(uname -m)" > /www/index.html
              exec httpd -f -p 8080 -h /www
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: web-root
              mountPath: /www
      volumes:
        - name: web-root
          emptyDir:
            sizeLimit: 1Mi
---
apiVersion: v1
kind: Service
metadata:
  name: hello-arm64
spec:
  type: ClusterIP
  selector:
    app: hello-arm64
  ports:
    - name: http
      port: 80
      targetPort: http
